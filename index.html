<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Skill Ladder</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f5f7fa;
      color: #222;
      max-width: 800px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    h1 {
      color: #2a5bd7;
      margin-bottom: 8px;
    }

    h2 {
      margin: 32px 0 12px;
    }

    .hidden {
      display: none;
    }

    /* ---------- Form ---------- */
    form {
      background-color: white;
      border: 1px solid #d5dbe5;
      border-radius: 8px;
      padding: 16px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 12px 0 6px;
    }

    label:first-child {
      margin-top: 0;
    }

    input,
    textarea {
      width: 100%;
      font: inherit;
      font-size: 16px; /* 16px stops iPhones zooming in on focus */
      padding: 10px;
      border: 1px solid #b8c1d1;
      border-radius: 6px;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    button {
      font: inherit;
      font-size: 16px;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      background-color: #2a5bd7;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #1f47ad;
    }

    button.secondary {
      background-color: #e4e8f0;
      color: #222;
    }

    button.secondary:hover {
      background-color: #d3d9e5;
    }

    button.danger {
      background-color: #c62828;
    }

    button.danger:hover {
      background-color: #a31f1f;
    }

    #saveButton {
      margin-top: 16px;
      width: 100%;
    }

    #message {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 6px;
      background-color: #fdecea;
      color: #8a1c1c;
      border: 1px solid #f5b5b0;
    }

    #message.success {
      background-color: #e7f6ec;
      color: #1b5e30;
      border-color: #a8d9b6;
    }

    /* ---------- Library ---------- */
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }

    .card {
      background-color: white;
      border: 1px solid #d5dbe5;
      border-radius: 8px;
      padding: 14px 16px;
      text-align: left;
      color: #222;
      cursor: pointer;
      width: 100%;
    }

    .card:hover {
      background-color: #f0f4ff;
      border-color: #2a5bd7;
    }

    .card-title {
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 10px;
      overflow-wrap: anywhere;
    }

    .platform {
      display: inline-block;
      font-size: 13px;
      background-color: #e4ecff;
      color: #2a5bd7;
      border-radius: 12px;
      padding: 3px 10px;
    }

    .card-date {
      margin-top: 10px;
      font-size: 13px;
      color: #666;
    }

    #emptyMessage {
      color: #666;
    }

    /* ---------- Detail view ---------- */
    #detail {
      background-color: white;
      border: 1px solid #d5dbe5;
      border-radius: 8px;
      padding: 16px;
      margin-top: 16px;
    }

    #detail h2 {
      margin-top: 12px;
      overflow-wrap: anywhere;
    }

    #detailLink {
      overflow-wrap: anywhere;
    }

    #detail ul {
      padding-left: 22px;
    }

    #detail li {
      margin-bottom: 6px;
      overflow-wrap: anywhere;
    }

    .detail-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
    }

    .detail-buttons button {
      flex: 1;
    }
  </style>
</head>
<body>
  <h1>My Skill Ladder</h1>

  <p>This app is cool</p>

  <div id="listView">
    <form id="videoForm" novalidate>
      <label for="title">Title</label>
      <input type="text" id="title" placeholder="What is this video about?">

      <label for="link">Link</label>
      <input type="text" id="link" placeholder="Paste the link here" inputmode="url" autocapitalize="off" autocorrect="off">

      <label for="points">Key points</label>
      <textarea id="points" placeholder="Enter 1 to 5 key takeaways, one per line"></textarea>

      <button type="submit" id="saveButton">Save</button>
      <div id="message" class="hidden" role="alert"></div>
    </form>

    <h2>Library</h2>
    <p id="emptyMessage">No videos saved yet.</p>
    <div id="grid"></div>
  </div>

  <div id="detailView" class="hidden">
    <div id="detail">
      <div class="detail-buttons">
        <button type="button" class="secondary" id="backButton">Back</button>
        <button type="button" class="danger" id="deleteButton">Delete</button>
      </div>
      <h2 id="detailTitle"></h2>
      <p><span class="platform" id="detailPlatform"></span> <span id="detailDate"></span></p>
      <p><a id="detailLink" target="_blank" rel="noopener noreferrer"></a></p>
      <h3>Key points</h3>
      <ul id="detailPoints"></ul>
    </div>
  </div>

  <script>
    // ================= STORAGE =================
    // The whole library is one array of video objects, stored as text (JSON)
    // in localStorage under this key.
    var STORAGE_KEY = "skillLadderVideos";
    var videos = loadVideos();
    var openVideoId = null;

    function loadVideos() {
      try {
        var saved = localStorage.getItem(STORAGE_KEY);
        var parsed = saved ? JSON.parse(saved) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch (error) {
        return [];
      }
    }

    function saveVideos() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(videos));
        return true;
      } catch (error) {
        return false;
      }
    }

    // ================= HELPERS =================
    function getPlatform(link) {
      var url = link.toLowerCase();
      if (url.indexOf("tiktok.com") !== -1) return "TikTok";
      if (url.indexOf("instagram.com") !== -1) return "Instagram";
      if (url.indexOf("youtube.com") !== -1 || url.indexOf("youtu.be") !== -1) return "YouTube";
      return "Other";
    }

    function formatDate(timestamp) {
      return new Date(timestamp).toLocaleDateString(undefined, {
        year: "numeric", month: "short", day: "numeric"
      });
    }

    function isHttpLink(text) {
      return /^https?:\/\//i.test(text);
    }

    // ================= FORM + SAVE BUTTON =================
    var form = document.getElementById("videoForm");
    var titleInput = document.getElementById("title");
    var linkInput = document.getElementById("link");
    var pointsInput = document.getElementById("points");
    var messageBox = document.getElementById("message");

    function showMessage(text, isSuccess) {
      messageBox.textContent = text;
      messageBox.className = isSuccess ? "success" : "";
    }

    function hideMessage() {
      messageBox.className = "hidden";
      messageBox.textContent = "";
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      var title = titleInput.value.trim();
      var link = linkInput.value.trim();
      var points = pointsInput.value
        .split("\n")
        .map(function (line) { return line.trim(); })
        .filter(function (line) { return line !== ""; });

      var problems = [];
      if (title === "") problems.push("Title is missing.");
      if (link === "") {
        problems.push("Link is missing.");
      } else if (!isHttpLink(link)) {
        problems.push("Link must start with http.");
      }
      if (points.length === 0) {
        problems.push("Key points are missing (enter at least 1).");
      } else if (points.length > 5) {
        problems.push("Too many key points (" + points.length + "). Enter 5 or fewer.");
      }

      if (problems.length > 0) {
        showMessage(problems.join(" "), false);
        return;
      }

      videos.unshift({
        id: Date.now().toString(),
        title: title,
        link: link,
        platform: getPlatform(link),
        points: points,
        added: Date.now()
      });

      if (!saveVideos()) {
        videos.shift();
        showMessage("Could not save. Your browser may be blocking storage.", false);
        return;
      }

      form.reset();
      renderLibrary();
      showMessage("Saved!", true);
    });

    // Clear any old error as soon as the user starts fixing things.
    [titleInput, linkInput, pointsInput].forEach(function (field) {
      field.addEventListener("input", hideMessage);
    });

    // ================= LIBRARY =================
    var grid = document.getElementById("grid");
    var emptyMessage = document.getElementById("emptyMessage");

    function renderLibrary() {
      grid.textContent = "";
      emptyMessage.classList.toggle("hidden", videos.length > 0);

      // New videos are added to the front of the array, so the array is already newest first.
      videos.forEach(function (video) {
        var card = document.createElement("button");
        card.type = "button";
        card.className = "card";

        var title = document.createElement("div");
        title.className = "card-title";
        title.textContent = video.title;

        var platform = document.createElement("span");
        platform.className = "platform";
        platform.textContent = video.platform;

        var date = document.createElement("div");
        date.className = "card-date";
        date.textContent = "Added " + formatDate(video.added);

        card.appendChild(title);
        card.appendChild(platform);
        card.appendChild(date);
        card.addEventListener("click", function () { openDetail(video.id); });
        grid.appendChild(card);
      });
    }

    // ================= DETAIL VIEW =================
    var listView = document.getElementById("listView");
    var detailView = document.getElementById("detailView");

    function openDetail(id) {
      var video = videos.filter(function (v) { return v.id === id; })[0];
      if (!video) return;
      openVideoId = id;

      document.getElementById("detailTitle").textContent = video.title;
      document.getElementById("detailPlatform").textContent = video.platform;
      document.getElementById("detailDate").textContent = "Added " + formatDate(video.added);

      var linkEl = document.getElementById("detailLink");
      linkEl.textContent = video.link;
      if (isHttpLink(video.link)) {
        linkEl.href = video.link;
      } else {
        linkEl.removeAttribute("href");
      }

      var list = document.getElementById("detailPoints");
      list.textContent = "";
      video.points.forEach(function (point) {
        var item = document.createElement("li");
        item.textContent = point;
        list.appendChild(item);
      });

      listView.classList.add("hidden");
      detailView.classList.remove("hidden");
      window.scrollTo(0, 0);
    }

    function closeDetail() {
      openVideoId = null;
      detailView.classList.add("hidden");
      listView.classList.remove("hidden");
    }

    document.getElementById("backButton").addEventListener("click", closeDetail);

    document.getElementById("deleteButton").addEventListener("click", function () {
      if (!confirm("Delete this video? This cannot be undone.")) return;
      videos = videos.filter(function (v) { return v.id !== openVideoId; });
      saveVideos();
      renderLibrary();
      closeDetail();
    });

    // ================= START =================
    renderLibrary();
  </script>
</body>
</html>
